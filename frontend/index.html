    <script>
      // Early audio interception
      (function() {
        window.__audioElements = window.__audioElements || [];
        
        try {
          const OriginalAudio = window.Audio;
          window.Audio = class extends OriginalAudio {
            constructor(...args) {
              super(...args);
              console.log('[early-audio] Intercepted new Audio()', this);
              window.__audioElements.push(this);
              if (typeof window.__onAudioCreated === 'function') {
                window.__onAudioCreated(this);
              }
            }
          };

          const originalCreateElement = document.createElement;
          document.createElement = function(tagName, options) {
            const element = originalCreateElement.call(document, tagName, options);
            if (tagName && tagName.toLowerCase() === 'audio') {
              console.log('[early-audio] Intercepted document.createElement("audio")', element);
              window.__audioElements.push(element);
              if (typeof window.__onAudioCreated === 'function') {
                window.__onAudioCreated(element);
              }
            }
            return element;
          };
          console.log('[early-audio] Successfully installed audio monkeypatches');
        } catch (e) {
          console.error('[early-audio] Failed to install audio monkeypatches', e);
        }
      })();
    </script>
    <script>
      // Sanitize localStorage.modelInfo to avoid parse errors in the bundle.
      try {
        const raw = localStorage.getItem('modelInfo');
        if (raw === null || raw === 'undefined') throw new Error('invalid');
        JSON.parse(raw);
      } catch (e) {
        localStorage.setItem('modelInfo', JSON.stringify({ characters: [{ name: 'andry_3d', model_path: 'live3d-model/andry_3d/avatar_animasi.glb' }] }));
      }

      // Reset stale backgroundUrl to ensure the new default_background.jpg is used
      try {
        const bgUrl = localStorage.getItem('backgroundUrl');
        if (bgUrl) {
          const parsed = JSON.parse(bgUrl);
          if (typeof parsed === 'string' && (parsed.includes('ceiling-window-room-night') || parsed.includes('back_2.jpg') || parsed.includes('ceiling-window-room-night.jpeg'))) {
            localStorage.removeItem('backgroundUrl');
          }
        }
      } catch (e) {}
    </script>
    <script>
      // capture console calls for debugging
      (function(){
        window.__consoleLogs = window.__consoleLogs || [];
        ['log','warn','error','info'].forEach((k)=>{
          const orig = console[k];
          console[k] = function(){
            try{ window.__consoleLogs.push({type:k, args: Array.from(arguments)}); } catch(e){}
            orig && orig.apply(console, arguments);
          };
        });
      })();
    </script>
